<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Círculo exterior punteado (r = 90 en canvas, representa terreno d = 20) -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 4" />

  <!-- Primera lona (cuadrado base inscrito) -->
  <rect x="36.4" y="36.4" width="127.2" height="127.2" fill="#ffffff" stroke="#0f172a" stroke-width="2.5" />

  <!-- Segunda lona (cuadrado rotado 45° inscrito) -->
  <polygon points="100,10 190,100 100,190 10,100" fill="#3b82f6" fill-opacity="0.18" stroke="#3b82f6" stroke-width="2.5" />

  <!-- Línea de diámetro indicativa con topes -->
  <line x1="10" y1="100" x2="190" y2="100" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3 3" />
  <circle cx="10" cy="100" r="2.5" fill="#64748b" />
  <circle cx="190" cy="100" r="2.5" fill="#64748b" />
  <circle cx="100" cy="100" r="3" fill="#64748b" />

  <!-- Etiqueta del diámetro requerida -->
  <text x="100" y="93" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#475569">d = 20</text>
</svg>