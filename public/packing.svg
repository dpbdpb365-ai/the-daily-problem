<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Cuadrado exterior (Línea punteada para representar el área total) -->
  <rect x="10" y="10" width="180" height="180" fill="none" stroke="#0f172a" stroke-width="3" />
  <!-- Los 3 círculos -->
  <circle cx="47.3" cy="47.3" r="37.3" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" />
  <circle cx="100" cy="100" r="37.3" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" />
  <circle cx="152.7" cy="152.7" r="37.3" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" />
  <!-- Línea diagonal indicativa -->
  <line x1="10" y1="10" x2="190" y2="190" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4" />
</svg>
